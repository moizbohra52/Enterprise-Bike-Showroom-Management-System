# 4G is enough for this app (Dart AOT/JIT + one Android module) and leaves room
# for Android Studio / an emulator on a 16 GB machine; an 8G heap makes the
# Gradle daemon swap and can make it disappear mid-build.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# android/app/build.gradle.kts deliberately compiles against 35 even when the
# installed Flutter SDK defaults to 34 (see the comment there). AGP 8.6 was
# tested up to 34 and only warns about it; suppress that warning.
android.suppressUnsupportedCompileSdk=35

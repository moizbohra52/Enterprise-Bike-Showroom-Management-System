name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (AGP 8 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # Errors only: lints/infos are reported but must not fail the build until
      # the tree has been through a full `dart fix` pass.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit / widget tests
        if: ${{ hashFiles('test/**_test.dart') != '' }}
        run: flutter test

  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Placeholder Supabase credentials: development builds fall back to them,
      # so the APK compiles and boots without secrets in CI.
      - name: Build
        run: >
          flutter build apk --debug
          --dart-define=ENV=development

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
